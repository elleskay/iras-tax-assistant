name: Test (spec-driven)

on:
  pull_request:
    branches: [main]
  # Called by deploy.yml so a red gate blocks the deploy; pushes to main are
  # covered through that call instead of a second standalone run.
  workflow_call:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec:
    name: Spec coverage gate
    runs-on: ubuntu-latest
    env:
      # apps/web has no database or auth: state is a JSON store (lib/store.ts).
      # NODE_ENV=test keeps server caches (e.g. the prompt cache) out of the
      # e2e's way so activation effects are immediately observable.
      NODE_ENV: test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      # Scoped install: this job only exercises apps/web and the spec-test
      # package; skipping the demo app's dependency tree (Sentry, NextAuth,
      # PostHog, Resend) saves a chunk of install time on every run.
      - run: npm ci -w web -w @platform/spec-test --include-workspace-root
      - name: Build @platform/spec-test (dist is gitignored)
        working-directory: packages/spec-test
        run: npm run build
      - name: Resolve Playwright version
        id: pw
        working-directory: apps/web
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      # On a cache hit the browser binary is already present, so skip the apt
      # round trip (--with-deps) that costs ~30-45s; ubuntu-latest already has
      # the shared libraries chromium needs.
      - name: Install Playwright browsers (cold cache)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Install Playwright browsers (warm cache)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install chromium
        working-directory: apps/web
      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: nextjs-web-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('apps/web/**/*.[jt]s', 'apps/web/**/*.[jt]sx') }}
          restore-keys: |
            nextjs-web-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck
      - name: Lint (includes spec-test/require-expect-in-spec-test rule)
        working-directory: apps/web
        run: npm run lint
      - name: Build app
        working-directory: apps/web
        run: npm run build
      - name: Run unit specs
        working-directory: apps/web
        run: npm run test:unit
      - name: Run e2e specs
        working-directory: apps/web
        run: npm run test:e2e
      - name: Spec coverage gate (fails if <100%)
        working-directory: apps/web
        run: npm run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spec-coverage
          path: apps/web/spec-coverage.md
          if-no-files-found: warn
      - name: Comment coverage on PR
        if: github.event_name == 'pull_request' && always()
        # Fork PRs run with a read-only token; a failed comment must not mark
        # a green test run as failed.
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'apps/web/spec-coverage.md';
            if (!fs.existsSync(path)) return;
            const body = fs.readFileSync(path, 'utf8');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
