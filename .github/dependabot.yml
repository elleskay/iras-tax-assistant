version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # Group only minor + patch updates so majors come through as individual,
    # reviewable PRs. Bundling majors (TypeScript 5->6, ESLint 9->10,
    # Vitest 2->4, etc.) makes bisectability impossible if anything regresses
    # and delays small security patches that would otherwise auto-merge.
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      production-dependencies:
        dependency-type: "production"
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # The three CDK packages have their own lockfiles (not workspaces). The one
  # that deploys production (web) matters most; _template and _setup keep the
  # reference copies current.
  - package-ecosystem: "npm"
    directory: "/infra/cdk/_template"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/infra/cdk/web"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/infra/cdk/_setup"
    schedule:
      interval: "weekly"

  # Python services: the RAG service is deployed (Fly.io); insights is offline.
  - package-ecosystem: "pip"
    directory: "/services/rag"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/services/insights"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/services/rag"
    schedule:
      interval: "weekly"
